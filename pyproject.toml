[project]
name = "voci"
dynamic = ["version"]
description = "Fast, concurrent test runner for Python."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
uvloop = ["uvloop>=0.21"]

[project.scripts]
voci = "voci.cli:main"

[dependency-groups]
dev = [
    "coverage>=7.10",
    "fastapi>=0.141.1",
    "httpx>=0.28",
    "pydantic>=2.13.4",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8",
    "ruff>=0.16.1",
]
# The docs site (zensical.toml, docs/). Zensical is pinned exactly rather than floored: it is
# 0.0.x, ships several releases a week, and the theme and config schema both move between them.
docs = [
    "mkdocstrings[python]>=1.0.6",
    "zensical==0.0.56",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version comes from the git tag (e.g. tag "v0.1.0" -> version "0.1.0"), written to
# voci/_version.py at build time. `fallback-version` covers builds with no reachable tag yet
# (fresh clone before the first release, or a shallow/tagless checkout).
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "voci/_version.py"

# `.venv` is in hatchling's own hardcoded EXCLUDED_DIRECTORIES, but `just py sync <version>`
# (justfile, recipes/py.just) gives every non-default interpreter its own `.venv-X.Y` alongside
# it, and hatchling only reads the root `.gitignore` for vcs-based exclusion, not the `*` one uv
# writes inside each venv it creates. Left uncovered, the sdist walk finds `.venv-3.13/bin/python`
# -- an absolute symlink to the system interpreter -- and `uv build` fails outright.
[tool.hatch.build]
exclude = ["/.venv-*"]

# Explicit, though it now matches hatchling's name-based auto-detection, since the packaging
# config shouldn't depend on distribution and package names staying aligned.
[tool.hatch.build.targets.wheel]
packages = ["voci"]

# `docs` joins `dev` in the environment `just sync` builds. Left out, every `just docs-build`
# would install the docs toolchain and the next `just sync` would uninstall it again.
[tool.uv]
default-groups = ["dev", "docs"]

# voci-migrate is a second distribution in this repo (plans/migration-tool-plan.md §2), kept in
# the same workspace so its generated output can be exercised against voci itself in one CI run.
[tool.uv.workspace]
members = ["voci-migrate"]

[tool.ruff]
line-length = 100
target-version = "py313"
# voci/_assertions/_vendor is kept byte-identical to upstream pytest so re-vendoring stays a
# cheap, readable diff (spec/07 Q17). Formatting it would defeat that, so ruff never touches it.
# voci-migrate/corpus holds deliberately-unidiomatic pytest suites used as codegen input
# fixtures, so linting them is meaningless. oss/ holds checkouts of other projects' suites, which
# answer to their own rules.
extend-exclude = [
    "oss",
    "research",
    "spec",
    "voci/_assertions/_vendor",
    "voci-migrate/corpus",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "C901", # mccabe complexity
]

# `Depends(...)` sitting in a parameter default (spec/01 §3's whole wiring syntax) is exactly the
# call-in-default-argument shape B008 exists to flag in general, but it's the intended spelling
# here, same as FastAPI's own `Depends()` it's modeled on. Whitelisted by qualified name so
# `voci.Depends(...)` and `Depends(...)` (after `from voci import Depends`) both pass; spec/01
# §10 names the one shape this can't cover -- a method call like `fixture.with_()`, which has no
# fixed qualified name to whitelist, is why that API was deferred rather than shipped needing
# every call site to disable the rule by hand. `voci._di.fixtures.Depends` covers the same spelling
# inside `_builtins/fixtures.py` itself, which wires a builtin fixture onto another one (`tmpdir`
# onto `tmp_path`) before the public `voci` package it would otherwise import from exists.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["voci.Depends", "Depends", "voci._di.fixtures.Depends"]

[tool.ruff.lint.isort]
known-first-party = ["voci", "voci_migrate"]
# Named rather than left to isort, which reads a package as first-party when a directory of that
# name sits where it looks for sources. A checkout of either project anywhere isort searches would
# otherwise file the installed package next to voci's own imports, and moving that checkout would
# reshuffle the import block of every module that uses it.
known-third-party = ["fastapi", "pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.pyrefly]
project-includes = [
    "voci/**/*.py",
    "tests/**/*.py",
    "scripts/**/*.py",
]
# Vendored code is upstream's problem, checked by upstream's own CI. voci-migrate/corpus
# holds deliberately-unidiomatic pytest suites used as codegen input fixtures, so type-checking
# them is meaningless.
project-excludes = [
    "oss/**",
    "research/**",
    "voci/_assertions/_vendor/**",
    "voci-migrate/corpus/**",
]
# `tests/` has no `__init__.py`, so pytest's own rootpath insertion puts it on `sys.path` and
# `tests/_support.py` is reachable as a bare `import _support` from every test file, subpackage
# or flat. Pyrefly doesn't replicate that rootpath algorithm on its own, so it needs the same
# root spelled out explicitly here.
search-path = ["tests"]
