[project]
name = "velox"
version = "0.1.0"
description = "Fast, concurrent test runner for Python."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
uvloop = ["uvloop>=0.21"]

[project.scripts]
velox = "velox.cli:main"

[dependency-groups]
dev = [
    "fastapi>=0.141.1",
    "httpx>=0.28",
    "pydantic>=2.13.4",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"
# velox/_vendor is kept byte-identical to upstream pytest so re-vendoring stays a cheap,
# readable diff (spec/07 Q17). Formatting it would defeat that, so ruff never touches it.
extend-exclude = ["pytest", "fastapi", "research", "spec", "velox/_vendor"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["velox"]
# The `fastapi/` reference submodule at the repo root otherwise makes isort read the installed
# `fastapi` package as first-party and file it next to velox's own imports.
known-third-party = ["fastapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.pyrefly]
project-includes = ["velox/**/*.py", "tests/**/*.py", "scripts/**/*.py"]
# Vendored code is upstream's problem, checked by upstream's own CI.
project-excludes = ["pytest/**", "research/**", "velox/_vendor/assertion/**"]
