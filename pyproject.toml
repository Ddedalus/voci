[project]
name = "velox"
version = "0.1.0"
description = "Fast, concurrent test runner for Python."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
velox = "velox.cli:main"

[dependency-groups]
dev = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["pytest", "research", "spec"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["velox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.pyrefly]
project-includes = ["velox/**/*.py", "tests/**/*.py"]
project-excludes = ["pytest/**", "research/**"]
