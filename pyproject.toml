[project]
name = "velox-test"
dynamic = ["version"]
description = "Fast, concurrent test runner for Python."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
uvloop = ["uvloop>=0.21"]

[project.scripts]
velox = "velox.cli:main"

[dependency-groups]
dev = [
    "fastapi>=0.141.1",
    "httpx>=0.28",
    "pydantic>=2.13.4",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version comes from the git tag (e.g. tag "v0.1.0" -> version "0.1.0"), written to
# velox/_version.py at build time. `fallback-version` covers builds with no reachable tag yet
# (fresh clone before the first release, or a shallow/tagless checkout).
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "velox/_version.py"

# Distribution name ("velox-test") no longer matches the importable package directory
# ("velox"), so hatchling's name-based auto-detection can't find it — point it there explicitly.
[tool.hatch.build.targets.wheel]
packages = ["velox"]

# velox-migrate is a second distribution in this repo (plans/migration-tool-plan.md §2), kept in
# the same workspace so its generated output can be exercised against velox itself in one CI run.
[tool.uv.workspace]
members = ["velox-migrate"]

[tool.ruff]
line-length = 100
target-version = "py313"
# velox/_assertions/_vendor is kept byte-identical to upstream pytest so re-vendoring stays a
# cheap, readable diff (spec/07 Q17). Formatting it would defeat that, so ruff never touches it.
# velox-migrate/corpus holds deliberately-unidiomatic pytest suites used as codegen input
# fixtures, so linting them is meaningless.
extend-exclude = [
    "pytest",
    "fastapi",
    "research",
    "spec",
    "velox/_assertions/_vendor",
    "velox-migrate/corpus",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

# `Depends(...)` sitting in a parameter default (spec/01 §3's whole wiring syntax) is exactly the
# call-in-default-argument shape B008 exists to flag in general, but it's the intended spelling
# here, same as FastAPI's own `Depends()` it's modeled on. Whitelisted by qualified name so
# `velox.Depends(...)` and `Depends(...)` (after `from velox import Depends`) both pass; spec/01
# §10 names the one shape this can't cover -- a method call like `fixture.with_()`, which has no
# fixed qualified name to whitelist, is why that API was deferred rather than shipped needing
# every call site to disable the rule by hand.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["velox.Depends", "Depends"]

[tool.ruff.lint.isort]
known-first-party = ["velox", "velox_migrate"]
# The `fastapi/` reference submodule at the repo root otherwise makes isort read the installed
# `fastapi` package as first-party and file it next to velox's own imports.
known-third-party = ["fastapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.pyrefly]
project-includes = [
    "velox/**/*.py",
    "tests/**/*.py",
    "scripts/**/*.py",
]
# Vendored code is upstream's problem, checked by upstream's own CI. velox-migrate/corpus
# holds deliberately-unidiomatic pytest suites used as codegen input fixtures, so type-checking
# them is meaningless.
project-excludes = [
    "pytest/**",
    "research/**",
    "velox/_assertions/_vendor/**",
    "velox-migrate/corpus/**",
]
# `tests/` has no `__init__.py`, so pytest's own rootpath insertion puts it on `sys.path` and
# `tests/_support.py` is reachable as a bare `import _support` from every test file, subpackage
# or flat. Pyrefly doesn't replicate that rootpath algorithm on its own, so it needs the same
# root spelled out explicitly here.
search-path = ["tests"]
