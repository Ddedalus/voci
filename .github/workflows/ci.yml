name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    # Both supported interpreters, for the same reason the test job runs both: pyrefly narrows
    # `sys.version_info` branches to the version it is checking under, so a single interpreter
    # leaves the other half of every such branch unchecked.
    name: Typecheck (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run pyrefly check
      - run: uv run pyrefly check --progress-bar no voci-migrate/voci_migrate voci-migrate/scripts voci-migrate/tests

  test:
    # Both supported interpreters, because they disagree about annotations: 3.14 computes them
    # lazily (PEP 649) and hands `voci._di.fixtures` source text where 3.13 hands it objects,
    # so each version exercises a different half of the injection scan. `recipes/py.just`'s
    # `supported` is the same list for local runs, and has to be edited alongside both matrices
    # here -- this workflow calls uv directly, so it can't read the list from just.
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run pytest
      - run: uv run pytest voci-migrate/tests

  coverage:
    # A real suite measured the way a user's project measures one: `coverage run -m voci`, over
    # an example that includes `@voci.isolated` tests, with no combine step in between.
    name: Coverage (coverage run -m voci)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/02-async-library
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages
        working-directory: .
      # `--project` because the example is a project of its own, with no voci in its
      # dependencies -- the environment to run it from is the repository's.
      - run: uv run --project ../.. coverage run --source=relay -m voci
      - run: uv run --project ../.. coverage report -m --fail-under=95

  test-coverage:
    # Test coverage of voci's own suite, feeding the README badge -- distinct from `coverage`
    # above, which measures voci's coverage *feature*, not its own line coverage. main only: a
    # full instrumented run on every PR push is more than the badge is worth, and the badge
    # reflects main regardless.
    name: Test coverage (badge)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages
      # tests/run/test_coverage.py exercises voci's own coverage-subprocess plumbing against a
      # live Coverage object it expects to control -- some of its cases assert nothing is
      # measuring in the ambient environment, others juggle their own data files. Both premises
      # break when the whole suite is itself run under `coverage run`, so this job (only this
      # job; the `test` job above runs the module normally) excludes it.
      - run: uv run coverage run --source=voci -m pytest --ignore=tests/run/test_coverage.py
      - run: uv run coverage run --source=voci_migrate -a -m pytest voci-migrate/tests
      - run: uv run coverage report -m
      # Published to an orphan `badges` branch that `on.push` above never matches, built straight
      # from git's plumbing rather than a checkout: no working tree to dirty, no commit landing on
      # main, and nothing for this workflow to re-trigger on -- no `[skip ci]` needed either.
      - name: Publish badge
        run: |
          pct=$(uv run coverage report --format=total)
          color=red
          if [ "$pct" -ge 90 ]; then color=brightgreen
          elif [ "$pct" -ge 75 ]; then color=green
          elif [ "$pct" -ge 60 ]; then color=yellow
          fi
          json=$(printf '{"schemaVersion": 1, "label": "coverage", "message": "%s%%", "color": "%s"}\n' "$pct" "$color")

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin badges:refs/remotes/origin/badges 2>/dev/null || true

          blob=$(echo "$json" | git hash-object -w --stdin)
          tree=$(printf '100644 blob %s\tcoverage.json\n' "$blob" | git mktree)
          parent=$(git rev-parse -q --verify origin/badges) || true

          if [ -n "$parent" ] && [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then
            echo "badge unchanged"
            exit 0
          fi

          if [ -n "$parent" ]; then
            commit=$(git commit-tree -p "$parent" -m "Update coverage badge" "$tree")
          else
            commit=$(git commit-tree -m "Update coverage badge" "$tree")
          fi
          git push origin "$commit:refs/heads/badges"

  corpus-check:
    name: Corpus check (voci-migrate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run python voci-migrate/scripts/refresh_corpus_dumps.py --check

  vendor-check:
    name: Vendor check (pytest submodule)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run python scripts/vendor_assertion.py --check

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv build
