name: Release

# Publish to PyPI when a GitHub Release is published. One tag (`vX.Y.Z`) and one Release covers
# both packages -- they're tested and released together, so both build/publish jobs always run,
# and both packages' versions are derived from that same tag by hatch-vcs (root pyproject.toml
# and voci-migrate/pyproject.toml's [tool.hatch.version]).
#
# The two publish jobs use different `environment` names (`pypi` / `pypi-migrate`) even though
# they share this one workflow file and tag: PyPI's trusted-publisher registration is keyed on
# (repository, workflow filename, environment) and ties that triple to exactly one PyPI project,
# so voci and voci-migrate need distinct environments to each register their own.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyrefly check
      - run: uv run pyrefly check --progress-bar no voci-migrate/voci_migrate voci-migrate/scripts voci-migrate/tests
      - run: uv run pytest
      - run: uv run pytest voci-migrate/tests

  build-voci:
    name: Build voci
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv build

      - name: Verify built version matches release tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          wheel="$(ls dist/*.whl)"
          built="$(basename "$wheel" | cut -d- -f2)"
          if [ "$built" != "$tag" ]; then
            echo "::error::Built version '$built' (from $wheel) does not match release tag 'v$tag'"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-voci
          path: dist/

  build-voci-migrate:
    name: Build voci-migrate
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv build --package voci-migrate

      - name: Verify built version matches release tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          wheel="$(ls dist/*.whl)"
          built="$(basename "$wheel" | cut -d- -f2)"
          if [ "$built" != "$tag" ]; then
            echo "::error::Built version '$built' (from $wheel) does not match release tag 'v$tag'"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-voci-migrate
          path: dist/

  publish-voci:
    name: Publish voci to PyPI
    needs: build-voci
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/voci/
    permissions:
      id-token: write  # required for PyPI trusted publishing (OIDC) — no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-voci
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-voci-migrate:
    name: Publish voci-migrate to PyPI
    needs: build-voci-migrate
    runs-on: ubuntu-latest
    environment:
      name: pypi-migrate
      url: https://pypi.org/project/voci-migrate/
    permissions:
      id-token: write  # required for PyPI trusted publishing (OIDC) — no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-voci-migrate
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
