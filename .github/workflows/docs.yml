name: Docs

on:
  # Docs ship with the release they document, not with every push to main.
  release:
    types: [published]
  # Lets a maintainer redeploy without cutting a release, e.g. after enabling Pages for the
  # first time, or to pick up a docs-only fix.
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages
      # Same check CI's `just check` runs: fails if a generated reference page (cli.md,
      # matrix.md) is stale, or if the site itself fails Zensical's strict build.
      - run: uv run python scripts/gen_cli_reference.py --check
      - run: uv run python scripts/gen_support_matrix.py --check
      - run: uv run zensical build --clean
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
