[pytest]
testpaths = .
python_files =
    test_*.py
    check_*.py
norecursedirs = scratch
markers =
    slow: one of the suite's own tags, read by -m and by nothing else.
    timeout: what pytest-timeout would read, registered here so this suite needs no plugin.
    modmark: applied to every test in test_marks.py through the module's pytestmark.
    classmark: applied to TestGrouped's tests through the class's pytestmark.
    anyio: what an async runner reads to run a coroutine test.
