[pytest]
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
log_cli = true
log_cli_level = INFO
xfail_strict = true
markers =
    slow: one of the suite's own tags.
    timeout: what pytest-timeout would read, registered here so this suite needs no plugin.
    django_db: what pytest-django would act on, registered here for the same reason.
