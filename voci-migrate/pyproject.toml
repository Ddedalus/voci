[project]
name = "voci-migrate"
dynamic = ["version"]
description = "Migrate a pytest suite to voci."
requires-python = ">=3.13"
dependencies = [
    "libcst>=1.9",
]

[project.scripts]
voci-migrate = "voci_migrate.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version comes from the same `vX.Y.Z` git tag as the root voci package (see its own
# [tool.hatch.version] comment) -- the two packages release together under one tag/one GitHub
# Release, so no separate tag-pattern is needed here. `root` points at the actual repo root: this
# pyproject.toml lives a directory below it, and hatch-vcs/setuptools-scm otherwise looks for a
# `.git` next to this file, finds none, and silently settles for `fallback-version` instead of
# erroring -- easy to miss since `uv build --package voci-migrate` still succeeds either way.
# `fallback-version` covers builds with no reachable tag yet (fresh clone before the first
# release, or a shallow/tagless checkout).
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
raw-options = { root = ".." }

[tool.hatch.build.targets.wheel]
packages = ["voci_migrate"]

# `tests/` has no `__init__.py`, so pytest's own rootpath insertion puts it on `sys.path` and
# `tests/_support.py` is reachable as a bare `import _support` from every test file. Pyrefly
# doesn't replicate that rootpath algorithm on its own, so it needs the same root spelled out
# explicitly here.
[tool.pyrefly]
search-path = ["tests"]
