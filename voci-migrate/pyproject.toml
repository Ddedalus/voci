[project]
name = "voci-migrate"
dynamic = ["version"]
description = "Migrate a pytest suite to voci."
requires-python = ">=3.13"
dependencies = [
    "libcst>=1.9",
]

[project.scripts]
voci-migrate = "voci_migrate.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version comes from the git tag, written by hatch-vcs. `tag-pattern` scopes it to this package's
# own `migrate-vX.Y.Z` tags (release.yml's build-voci-migrate job) rather than the root voci
# package's `vX.Y.Z` ones -- both are tags in the same repo, and the two packages release
# independently. `fallback-version` covers builds with no reachable matching tag yet (fresh clone
# before the first voci-migrate release, or a shallow/tagless checkout).
[tool.hatch.version]
source = "vcs"
tag-pattern = "^migrate-v(?P<version>.*)$"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["voci_migrate"]

# `tests/` has no `__init__.py`, so pytest's own rootpath insertion puts it on `sys.path` and
# `tests/_support.py` is reachable as a bare `import _support` from every test file. Pyrefly
# doesn't replicate that rootpath algorithm on its own, so it needs the same root spelled out
# explicitly here.
[tool.pyrefly]
search-path = ["tests"]
