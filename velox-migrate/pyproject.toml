[project]
name = "velox-migrate"
version = "0.0.0"
description = "Migrate a pytest suite to velox."
requires-python = ">=3.13"
dependencies = [
    "libcst>=1.9",
]

[project.scripts]
velox-migrate = "velox_migrate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["velox_migrate"]
