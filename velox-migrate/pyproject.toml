[project]
name = "velox-migrate"
version = "0.0.0"
description = "Migrate a pytest suite to velox."
requires-python = ">=3.13"
dependencies = [
    "libcst>=1.9",
]

[project.scripts]
velox-migrate = "velox_migrate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["velox_migrate"]

# `tests/` has no `__init__.py`, so pytest's own rootpath insertion puts it on `sys.path` and
# `tests/_support.py` is reachable as a bare `import _support` from every test file. Pyrefly
# doesn't replicate that rootpath algorithm on its own, so it needs the same root spelled out
# explicitly here.
[tool.pyrefly]
search-path = ["tests"]
