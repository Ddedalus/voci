[project]
name = "voci-example-shared-resources"
version = "0.0.0"
requires-python = ">=3.13"

[tool.voci]
testpaths = ["tests"]
concurrency = 32
timeout = 60
# An unrecognized key here is an error, not a warning -- a typo'd config key that silently does
# nothing is a footgun voci doesn't have to have.

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
