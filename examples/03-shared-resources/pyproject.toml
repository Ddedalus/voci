[project]
name = "velox-example-shared-resources"
version = "0.0.0"
requires-python = ">=3.13"

[tool.velox]
testpaths = ["tests"]
concurrency = 32
timeout = 60
watchdog_threshold = 1.0
basetemp_retention = 3

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["velox.Depends"]
