[project]
name = "velox-example-shared-resources"
version = "0.0.0"
requires-python = ">=3.13"

[tool.velox]
testpaths = ["tests"]
concurrency = 32
timeout = 60
# watchdog_threshold and basetemp_retention are spec'd (spec/02 §3) but not recognized by
# _config.py yet -- deliberately deferred, no consumer before M2 (docs/M1-PLAN.md). The config
# loader rejects unknown keys rather than silently ignoring a typo, so they can't be listed here
# until they're real; see the "Known gaps" section of this example's README.

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["velox.Depends"]
