[project]
name = "voci-example-fastapi-crud"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic[email]>=2.9",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "voci",
]

[tool.uv.sources]
voci = { path = "../..", editable = true }

[tool.voci]
testpaths = ["tests"]
concurrency = 16
timeout = 60
env = { ENVIRONMENT = "test", SIGNUP_BONUS_CENTS = "0" }

# An unknown key in this table is an error, so a typo says so instead of doing nothing.

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` in a parameter default is FastAPI's injection syntax, used by `app/`, and B008
# fires on every route without this. The test suite injects via `Annotated[...]` metadata instead,
# which isn't a default and never trips B008.
extend-immutable-calls = ["fastapi.Depends"]
