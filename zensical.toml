# Zensical builds the documentation site from `docs/`. This file sits at the repo root rather than
# inside `docs/` so that `docs_dir` — which Zensical resolves relative to the config file — gets
# its default, and no config file ends up inside the published tree.

[project]
site_name = "voci"
site_description = "A concurrent test runner for async Python."
repo_url = "https://github.com/Ddedalus/voci"
repo_name = "Ddedalus/voci"

# A link to a page that doesn't exist, or to an anchor that doesn't, fails the build rather than
# shipping a dead link.
strict = true

nav = [
    { "Home" = "index.md" },
    { "Guide" = [
        "guide/index.md",
        "guide/scopes.md",
        "guide/marks.md",
        "guide/assertions.md",
        "guide/capture.md",
        "guide/use.md",
        "guide/parametrize.md",
        "guide/concurrency.md",
        "guide/exclusive.md",
        "guide/isolated.md",
        "guide/mocking.md",
        "guide/selection.md",
        "guide/config.md",
    ] },
    { "How-to" = [
        "how-to/index.md",
        "how-to/sharing-a-database-engine.md",
        "how-to/testing-a-fastapi-app.md",
        "how-to/tuning-concurrency.md",
        "how-to/debugging-a-flaky-test.md",
        "how-to/measuring-coverage.md",
    ] },
    { "Migrating" = [
        "migrate/index.md",
        "migrate/matrix.md",
    ] },
    { "Reference" = [
        "reference/index.md",
        "reference/fixtures.md",
        "reference/marks.md",
        "reference/builtins.md",
        "reference/assertions.md",
        "reference/warnings.md",
        "reference/fastapi.md",
        "reference/cli.md",
    ] },
    { "About" = [
        "about/index.md",
        "about/alternatives.md",
    ] },
]

[project.theme]
# Zensical's default variant, stated explicitly so a change of default doesn't restyle the site
# underneath us.
variant = "modern"
language = "en"
# Both paths are relative to `docs/`, and the files under `docs/static/` are copied through to
# the built site as-is. The SVG scales to whatever size the header gives it; the PNG is there for
# the favicon, which browsers are less uniform about accepting as SVG.
logo = "static/voci-logo-2.svg"
favicon = "static/voci-logo-2.png"
# A section's `index.md` is the section itself, so "Guide" in the nav opens `guide/index.md`
# rather than expanding to a lone child of the same name.
features = ["navigation.indexes"]
# The repo link in the header defaults to a generic git icon; the GitHub mark is what readers
# expect for a github.com link.
icon.repo = "fontawesome/brands/github"

# Three palette entries are what puts a color-scheme toggle in the header: the first follows the
# reader's system preference, the other two pin light and dark.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# Reference pages are rendered from the source by mkdocstrings, which Zensical loads as a
# Markdown extension rather than a MkDocs plugin -- the table below is what it reads.
[project.plugins.mkdocstrings.handlers.python]
# The repo root, so `voci` and `voci.fastapi` resolve from the checkout being documented rather
# than from whatever copy happens to be installed.
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "sphinx"
# `voci/__init__.py` is the public surface; anything underscore-prefixed reached through it is
# private and stays out of the rendered page.
filters = ["!^_"]
merge_init_into_class = true
separate_signature = true
show_root_heading = true
show_signature_annotations = true
# The source of a public symbol is a click away in the reader's own editor; inlining it here
# doubles the length of every entry with the body of a decorator factory.
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true
# Types in a signature link to their own page, so `Scope` in `fixture`'s signature is a way in.
signature_crossrefs = true
